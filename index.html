<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>岁时记 - 二十四节气小游戏</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="scene-bg"></div>

    <div class="term-title" id="termTitle"></div>
    <div class="day-display" id="dayDisplay"></div>
    <div class="weather-display" id="weatherDisplay"></div>
    <div class="speed-control-wrap">
        <div>时间流速：每 <span id="speedValue">5</span> 秒 = 游戏1天</div>
        <input type="range" id="speedSlider" min="1" max="30" value="5">
        <button id="pauseBtn">暂停时间</button>
    </div>

    <div class="ui-panel">
        <button id="btnPrevTerm">← 上一节气</button>
        <button id="btnNextTerm">下一节气 →</button>
        <button id="btnAdvanceDay">推进一日</button>
        <button id="btnMute">静音</button>
        <button id="btnSave">手动存档</button>
        <button id="btnLoad">读取存档</button>
        <button id="btnReset">重置游戏</button>
    </div>

    <!-- 节气弹窗 -->
    <div class="term-modal" id="termModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-desc" id="modalDesc"></div>
            <button class="modal-close-btn" id="btnCloseTermModal">知此岁时</button>
        </div>
    </div>

    <!-- 节气事件弹窗 -->
    <div class="event-modal" id="eventModal">
        <div class="event-box">
            <div class="event-title" id="eventTitle"></div>
            <div class="event-desc" id="eventDesc"></div>
            <button class="modal-close-btn" id="btnCloseEventModal">知晓</button>
        </div>
    </div>

    <!-- 脚本加载顺序严格不可调换 -->
    <script src="js/config.js"></script>
    <script src="js/gameState.js"></script>
    <script src="js/audioSystem.js"></script>
    <script src="js/weatherSystem.js"></script>
    <script src="js/weatherEffectSystem.js"></script>
    <script src="js/timeSystem.js"></script>
    <script src="js/uiSystem.js"></script>
</body>
</html>
